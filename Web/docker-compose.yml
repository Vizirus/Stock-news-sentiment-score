version: "3.9"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD_FILE: /run/secrets/db_sa_password
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
      - ../db_backups:/var/opt/mssql/backup
      - ./fake_meminfo:/proc/meminfo:ro
    networks:
      - app-network
    restart: unless-stopped
    secrets:
      - db_sa_password
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$(cat /run/secrets/db_sa_password | tr -d '\r') -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: Web/Dockerfile
    container_name: mvc-web-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
    secrets:
      - source: db_connection_string
        target: ConnectionStrings__DefaultConnection
      - source: sentiment_llm_api_key
        target: SentimentLlm__ApiKey
      - source: news_api_base_url
        target: NewsApi__BaseUrl
      - source: news_api_api_key
        target: NewsApi__ApiKey
    networks:
      - app-network
    restart: unless-stopped

  proxy:
    image: nginx:latest
    container_name: nginx-proxy
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - app-network
    restart: unless-stopped

volumes:
  sql_data:

networks:
  app-network:
    driver: bridge

secrets:
  db_sa_password:
    file: ../secrets/sa_password.txt
  db_connection_string:
    file: ../secrets/connection_string.txt
  sentiment_llm_api_key:
    file: ../secrets/sentiment_llm_api_key.txt
  news_api_base_url:
    file: ../secrets/news_api_base_url.txt
  news_api_api_key:
    file: ../secrets/news_api_api_key.txt
